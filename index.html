<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Free Job Interviews by Swabhi</title>
    <style>
        :root {
            --brand-red: #DC2626; 
            --brand-red-hover: #B91C1C;
            --brand-dark: #111827; 
            --brand-light: #F3F4F6;
            --border-color: #E5E7EB;
            --success-green: #059669;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--brand-light); color: var(--brand-dark); line-height: 1.5; }
        
        /* Navigation */
        .navbar { background: #fff; padding: 15px 5%; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; }
        .navbar h1 span { color: var(--brand-red); font-size: 1rem; display: block; letter-spacing: 1px; }
        
        .nav-links button { background: none; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: #6B7280; margin-left: 20px; transition: color 0.2s; }
        .nav-links button:hover, .nav-links button.active { color: var(--brand-dark); }
        .nav-links button.active { border-bottom: 2px solid var(--brand-red); padding-bottom: 5px; }

        /* Search & Filter Header */
        .portal-header { background: var(--brand-dark); padding: 40px 20px; text-align: center; }
        .search-container { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box { flex-grow: 1; padding: 15px; border-radius: 8px; border: none; font-size: 1.1rem; outline: none; min-width: 250px; }
        .search-btn { background: var(--brand-red); color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .filter-row { max-width: 800px; margin: 15px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .filter-row select { padding: 12px; border-radius: 6px; border: none; font-size: 0.95rem; outline: none; cursor: pointer; }

        /* Portal Body */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); }
        
        .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        /* Job Cards */
        .job-card { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; display: flex; flex-direction: column; position: relative; }
        .job-card:hover { border-color: var(--brand-red); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05); }
        
        .card-header-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .job-title { font-size: 1.3rem; font-weight: 800; line-height: 1.2; padding-right: 30px; }
        
        /* Save Bookmark Button */
        .save-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #D1D5DB; transition: color 0.2s; }
        .save-btn.saved { color: var(--brand-red); }
        
        .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .tag { background: var(--brand-light); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; color: #4B5563; }
        
        .salary { font-size: 1.1rem; font-weight: 700; color: var(--brand-red); margin-bottom: 15px; }
        .requirements { flex-grow: 1; font-size: 0.9rem; color: #4B5563; margin-bottom: 20px; }
        .requirements ul { padding-left: 20px; margin-top: 5px; }
        
        .apply-btn { background: var(--brand-dark); color: #fff; font-weight: 600; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s; }
        .apply-btn:hover { background: var(--brand-red); }
        .apply-btn.applied { background: var(--success-green); cursor: default; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #fff; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #9CA3AF; }
        
        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
        .modal-subtitle { font-size: 0.95rem; color: #6B7280; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--brand-red); }
        
        .success-screen { display: none; text-align: center; }
        .success-screen h3 { color: var(--success-green); font-size: 1.5rem; margin-bottom: 10px; }
        
        #loadingSpinner { display: none; text-align: center; color: var(--brand-red); font-weight: bold; margin-top: 10px; }
        .empty-state { text-align: center; padding: 40px; color: #6B7280; font-size: 1.1rem; grid-column: 1/-1; }
    </style>
</head>
<body>

    <!-- Portal Navigation -->
    <nav class="navbar">
        <h1>FREE JOB INTERVIEWS <span>BY SWABHI</span></h1>
        <div class="nav-links">
            <button id="tab-all" class="active" onclick="switchTab('all')">Browse Jobs</button>
            <button id="tab-saved" onclick="switchTab('saved')">Saved <span id="saveCount">(0)</span></button>
        </div>
    </nav>

    <!-- Search Engine Header -->
    <header class="portal-header" id="portalHeader">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search by job title, skills, or keywords..." onkeyup="filterJobs()">
            <button class="search-btn" onclick="filterJobs()">Find Roles</button>
        </div>
        <div class="filter-row">
            <select id="filterType" onchange="filterJobs()"><option value="all">All Job Types</option></select>
            <select id="filterExperience" onchange="filterJobs()"><option value="all">All Experience</option></select>
            <select id="filterLocation" onchange="filterJobs()"><option value="all">All Locations</option></select>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container">
        <h2 class="section-title" id="sectionTitle">Open Roles</h2>
        <div class="job-grid" id="jobGrid">
            <div class="empty-state">Loading portal data...</div>
        </div>
    </div>

    <!-- Apply Modal -->
    <div class="modal-overlay" id="applyModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">✖</span>
            
            <div id="formScreen">
                <div class="modal-title">Fast-Track Application</div>
                <div class="modal-subtitle" id="modalJobTitle">Job Title</div>
                <form id="applyForm" onsubmit="submitApplication(event)">
                    <input type="hidden" id="jobIdInput">
                    <input type="hidden" id="jobTitleInput">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="applicantName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="applicantPhone" required placeholder="10-digit number">
                    </div>
                    
                    <!-- NEW DROPDOWN ADDED HERE -->
                    <div class="form-group">
                        <label>Current Status *</label>
                        <select id="applicantStatus" required>
                            <option value="" disabled selected>Select your current status...</option>
                            <option value="Fresher">Fresher (Never Worked)</option>
                            <option value="Working">Working currently</option>
                            <option value="Not Working">Not Working currently</option>
                        </select>
                    </div>

                    <button type="submit" class="apply-btn" id="submitBtn">Submit Application</button>
                    <div id="loadingSpinner">Sending to our team...</div>
                </form>
            </div>

            <div id="successScreen" class="success-screen">
                <h3>Application Tracked!</h3>
                <p>Your profile is now under review with our team.</p>
                <p style="margin-top: 15px; font-size: 0.9rem;">To verify your application immediately, you can call us directly.</p>
                <a href="tel:+916002413305" class="apply-btn" style="display:block; text-decoration:none; margin-top:15px; background:var(--brand-red);">📞 Call 60024 13305</a>
            </div>
        </div>
    </div>

    <script>
        // === PORTAL CONFIGURATION ===
        const SHEET_ID = "19N7jV-E8nE5OrEEFS2w5GxqlzFAS3RHER6JIv0ipDZg"; 
        
        // PASTE YOUR NEW APPS SCRIPT URL HERE AFTER DEPLOYING STEP 1
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCDV122h3vbrkrnf_TJCC2wiIxpQi_zdYhT2WnK1Bg_TyEKuZZtmwvgsXjoUBMfunA/exec"; 
        
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Listings`;

        // === STATE MANAGEMENT ===
        let allJobs = [];
        let currentTab = 'all'; 
        let savedJobs = JSON.parse(localStorage.getItem('swabhi_saved')) || [];
        let appliedJobs = JSON.parse(localStorage.getItem('swabhi_applied')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            updateSaveCount();
            fetchJobs();
        });

        function fetchJobs() {
            fetch(SHEET_URL)
            .then(res => res.text())
            .then(text => {
                const jsonStr = text.match(/(?<=.*\().*(?=\);)/s)[0];
                const data = JSON.parse(jsonStr);
                
                allJobs = data.table.rows.map(row => ({
                    id: row.c[0] ? String(row.c[0].v) : "",
                    title: row.c[1] ? row.c[1].v : "",
                    type: row.c[2] ? row.c[2].v : "",
                    experience: row.c[3] ? row.c[3].v : "",
                    location: row.c[4] ? row.c[4].v : "",
                    salary: row.c[5] ? row.c[5].v : "",
                    requirements: row.c[6] ? row.c[6].v : "",
                    status: row.c[8] ? row.c[8].v : ""
                })).filter(job => job.status.toLowerCase() === "open");

                populateFilters();
                filterJobs();
            })
            .catch(error => console.error("Database connection error:", error));
        }

        // === PORTAL LOGIC ===
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').classList.remove('active');
            document.getElementById('tab-saved').classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const header = document.getElementById('portalHeader');
            const title = document.getElementById('sectionTitle');
            
            if (tab === 'saved') {
                header.style.display = 'none'; 
                title.innerText = 'My Saved Opportunities';
            } else {
                header.style.display = 'block';
                title.innerText = 'Open Roles';
            }
            filterJobs();
        }

        function toggleSave(jobId, event) {
            event.stopPropagation();
            if (savedJobs.includes(jobId)) {
                savedJobs = savedJobs.filter(id => id !== jobId);
            } else {
                savedJobs.push(jobId);
            }
            localStorage.setItem('swabhi_saved', JSON.stringify(savedJobs));
            updateSaveCount();
            filterJobs(); 
        }

        function updateSaveCount() {
            document.getElementById('saveCount').innerText = `(${savedJobs.length})`;
        }

        // === SEARCH & RENDER ===
        function populateFilters() {
            // Get unique, non-empty values from the columns
            const types = [...new Set(allJobs.map(j => j.type).filter(Boolean))];
            const exps = [...new Set(allJobs.map(j => j.experience).filter(Boolean))];
            const locs = [...new Set(allJobs.map(j => j.location).filter(Boolean))];

            // Clear existing options except the first "All" option
            document.getElementById('filterType').options.length = 1;
            document.getElementById('filterExperience').options.length = 1;
            document.getElementById('filterLocation').options.length = 1;

            types.forEach(t => document.getElementById('filterType').add(new Option(t, t)));
            exps.forEach(e => document.getElementById('filterExperience').add(new Option(e, e)));
            locs.forEach(l => document.getElementById('filterLocation').add(new Option(l, l)));
        }

        function filterJobs() {
            let filtered = allJobs;

            if (currentTab === 'saved') {
                filtered = allJobs.filter(job => savedJobs.includes(job.id));
            } else {
                const searchQ = document.getElementById('searchInput').value.toLowerCase();
                const typeVal = document.getElementById('filterType').value;
                const expVal = document.getElementById('filterExperience').value;
                const locVal = document.getElementById('filterLocation').value;

                filtered = allJobs.filter(job => {
                    const matchSearch = job.title.toLowerCase().includes(searchQ) || job.requirements.toLowerCase().includes(searchQ);
                    const matchType = (typeVal === "all" || job.type === typeVal);
                    const matchExp = (expVal === "all" || job.experience === expVal);
                    const matchLoc = (locVal === "all" || job.location === locVal);
                    return matchSearch && matchType && matchExp && matchLoc;
                });
            }
            renderJobs(filtered);
        }

        function renderJobs(jobsToRender) {
            const grid = document.getElementById("jobGrid");
            grid.innerHTML = ""; 
            
            if(jobsToRender.length === 0) {
                grid.innerHTML = `<div class="empty-state">${currentTab === 'saved' ? "You haven't saved any roles yet." : "No roles match your search criteria."}</div>`;
                return;
            }

            jobsToRender.forEach(job => {
                const isSaved = savedJobs.includes(job.id);
                const isApplied = appliedJobs.includes(job.id);
                
                const reqListHtml = job.requirements.split('|').slice(0, 3).map(r => `<li>${r.trim()}</li>`).join('');

                const cardHTML = `
                    <div class="job-card">
                        <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${job.id}', event)" title="Save Job">
                            ${isSaved ? '♥' : '♡'}
                        </button>
                        
                        <div class="card-header-top">
                            <div class="job-title">${job.title}</div>
                        </div>
                        
                        <div class="meta-tags">
                            ${job.location ? `<span class="tag">📍 ${job.location}</span>` : ''}
                            ${job.type ? `<span class="tag">⏱️ ${job.type}</span>` : ''}
                            ${job.experience ? `<span class="tag">🎓 ${job.experience}</span>` : ''}
                        </div>
                        
                        <div class="salary">₹ ${job.salary}</div>
                        
                        <div class="requirements">
                            <strong>Key Requirements:</strong>
                            <ul>${reqListHtml}</ul>
                        </div>
                        
                        ${isApplied 
                            ? `<button class="apply-btn applied" disabled>✓ Application Submitted</button>`
                            : `<button class="apply-btn" onclick="openModal('${job.id}', '${job.title}')">Apply Now</button>`
                        }
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // === APPLICATION FLOW ===
        function openModal(id, title) {
            document.getElementById("jobIdInput").value = id;
            document.getElementById("jobTitleInput").value = title;
            document.getElementById("modalJobTitle").innerText = title;
            
            document.getElementById("formScreen").style.display = "block";
            document.getElementById("successScreen").style.display = "none";
            document.getElementById("applyForm").reset();
            document.getElementById("applyModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("applyModal").style.display = "none";
        }

        function submitApplication(event) {
            event.preventDefault(); 
            const name = document.getElementById("applicantName").value;
            const phone = document.getElementById("applicantPhone").value;
            const status = document.getElementById("applicantStatus").value; // Grab new dropdown value
            const jobId = document.getElementById("jobIdInput").value;
            const jobTitle = document.getElementById("jobTitleInput").value;

            document.getElementById("submitBtn").style.display = "none";
            document.getElementById("loadingSpinner").style.display = "block";

            const formData = new URLSearchParams();
            formData.append("name", name);
            formData.append("phone", phone);
            formData.append("status", status); // Send to Apps Script
            formData.append("jobId", jobId);
            formData.append("jobTitle", jobTitle);

            fetch(WEB_APP_URL, {
                method: "POST",
                body: formData
            })
            .then(() => {
                if (!appliedJobs.includes(jobId)) {
                    appliedJobs.push(jobId);
                    localStorage.setItem('swabhi_applied', JSON.stringify(appliedJobs));
                }
                
                document.getElementById("formScreen").style.display = "none";
                document.getElementById("successScreen").style.display = "block";
                document.getElementById("submitBtn").style.display = "block";
                document.getElementById("loadingSpinner").style.display = "none";
                
                filterJobs(); 
            })
            .catch(() => {
                alert("Network error. Please try submitting again.");
                document.getElementById("submitBtn").style.display = "block";
                document.getElementById("loadingSpinner").style.display = "none";
            });
        }
    </script>
</body>
</html>
