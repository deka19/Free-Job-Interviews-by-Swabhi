<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Careers | Free Job Interviews by Swabhi</title>
    <style>
        :root {
            --brand-red: #DC2626; 
            --brand-red-hover: #B91C1C;
            --brand-dark: #111827; 
            --brand-light: #F9FAFB;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --text-muted: #6B7280;
            --success-green: #059669;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--brand-light); color: var(--brand-dark); line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }

        /* ==================== HERO SECTION (ZOMATO STYLE) ==================== */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
        }

        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(17,24,39,0.2) 15%, rgba(17,24,39,0.65) 60%, rgba(17,24,39,0.92) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
            will-change: transform, opacity;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
        }
        .hero-title span {
            color: var(--brand-red);
            font-size: 1.05rem;
            display: block;
            letter-spacing: 2.5px;
            margin-top: 6px;
            font-weight: 800;
        }

        .hero-search-box {
            width: 100%;
            padding: 16px 22px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            outline: none;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            text-align: center;
            transition: box-shadow 0.2s ease;
        }
        .hero-search-box:focus {
            box-shadow: 0 12px 35px rgba(220, 38, 38, 0.25);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: rgba(255,255,255,0.85);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            animation: bounce 2s infinite;
            text-decoration: none;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -6px); }
            60% { transform: translate(-50%, -3px); }
        }

        @media(min-width: 768px) {
            .hero-section { justify-content: center; }
            .hero-content { margin-bottom: 0; }
            .hero-title { font-size: 3.2rem; }
            .hero-search-box { max-width: 500px; padding: 18px; }
            .scroll-indicator { bottom: 25px; }
        }

        /* ==================== STICKY FILTER BAR (THE ORDINARY ANIMATION) ==================== */
        .sticky-filter-wrapper {
            position: sticky;
            top: 0;
            z-index: 99;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.04);
            padding: 12px 16px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .sticky-filter-wrapper.is-stuck {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 8px 25px -5px rgba(0,0,0,0.08);
        }

        .sticky-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 1.15rem; /* Unified Size */
            font-weight: 900;
            color: var(--brand-dark);
            text-transform: uppercase;
            letter-spacing: -0.5px;
            
            /* Hidden initially */
            max-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sticky-brand span {
            color: var(--brand-red);
            font-size: 0.8rem; /* Unified Size */
            letter-spacing: 1.5px;
            font-weight: 800;
        }
        /* Activated when scroll hits the top */
        .sticky-filter-wrapper.is-stuck .sticky-brand {
            max-height: 40px; 
            opacity: 1;
            transform: translateY(0);
            margin-bottom: 12px;
        }

        .filter-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .filter-container select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            outline: none;
            cursor: pointer;
            background: #fff;
            transition: border-color 0.15s ease;
        }
        .filter-container select:focus { border-color: var(--brand-red); }
        @media(min-width: 768px) {
            .sticky-filter-wrapper { padding: 16px 24px; }
            .filter-container { gap: 14px; }
            .filter-container select { padding: 12px 18px; font-size: 0.92rem; }
        }

        /* ==================== MAIN CONTENT & CARDS ==================== */
        .content-main { flex: 1; }
        .container { max-width: 1100px; margin: 35px auto 25px auto; padding: 0 16px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 22px;
        }
        .eyebrow {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--brand-red);
            margin-bottom: 4px;
        }
        .section-title { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.4px; color: var(--brand-dark); }

            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #fff;
            border
